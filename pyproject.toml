[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "raisa"
dynamic = ["version"]
description = "Terminal client for the SCP Wiki: articles, bookmarks, search, inline images"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "DaemonLife" }]
requires-python = ">=3.10"
dependencies = ["beautifulsoup4"]

[project.optional-dependencies]
images = ["pillow"]
test = ["pytest", "pyte"]

[project.urls]
Homepage = "https://github.com/DaemonLife/raisa"

[project.scripts]
raisa = "raisa.cli:main"

[tool.setuptools]
packages = ["raisa"]

[tool.setuptools.dynamic]
version = { attr = "raisa.VERSION" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
addopts = "-p no:cacheprovider"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["B905"]       # zip() without strict=: the lengths are equal by construction
